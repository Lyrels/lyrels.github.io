<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="Flitdo">
  <!-- Flitdo icon, "Dot & stroke": the dot is capturing a task, the stroke is getting it done.
       Drawn on the 108dp adaptive-icon canvas and cropped to its visible 72dp area. -->
  <rect width="72" height="72" rx="16" fill="#4053E8"/>
  <g transform="translate(-14.5 -20.5)">
    <circle cx="31" cy="48" r="5" fill="#FF8A3D"/>
    <path d="M40.5 57.5L50 67L70 45" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
